name: ci-mcp-image
on:
  push:
    branches: [main]
    paths: ['server/src/mcpBackend.js', 'server/src/payoutsData.js', 'Dockerfile.mcp', '.github/workflows/ci-mcp-image.yml']
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          platforms: linux/arm64
          push: true
          tags: ghcr.io/curtismu7/meridian-mcp:${{ github.sha }},ghcr.io/curtismu7/meridian-mcp:latest
      - name: Make the package public (anonymous pull from the cluster)
        run: |
          # The package visibility toggle is UI-only; print instructions if 201 is not returned.
          # The cluster pull secret authorizes ghcr.io; visibility must be public or the secret's
          # PAT must include read:packages for curtismu7/meridian-mcp.
          echo "If the cluster pull fails with 'denied', set the package public in GitHub UI:"
          echo "  https://github.com/curtismu7/meridian-a2a-hop-LAB/pkgs/container/meridian-mcp"
