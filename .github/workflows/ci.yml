name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w web
      - run: npm test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.18.4
          curl -sSLO "$base/gitleaks_8.18.4_linux_x64.tar.gz"
          curl -sSLO "$base/gitleaks_8.18.4_checksums.txt"
          grep ' gitleaks_8.18.4_linux_x64.tar.gz$' gitleaks_8.18.4_checksums.txt | sha256sum -c -
          tar -xz -f gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on forbidden identifiers
        run: |
          if grep -rInE "cmuir_pingcorp|local\.ping-devops\.com|AI-DEMO2/" --include='*.js' --include='*.mjs' --include='*.jsx' --include='*.json' --include='*.md' . ; then
            echo "Forbidden identifier found (cross-repo import or wrong owner)"; exit 1
          fi
      - name: No AI attribution
        run: bash scripts/check-no-ai-attribution.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app (mock, loopback)
        run: |
          PORT=7720 nohup node server/src/index.js > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:7720/api/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1
      - run: npm run e2e
        env:
          E2E_SHOTS: ${{ runner.temp }}/e2e-screenshots
      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            ${{ runner.temp }}/e2e-screenshots
            .data/e2e-screenshots
            e2e-output
          retention-days: 7
